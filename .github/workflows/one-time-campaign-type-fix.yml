name: One-time campaign typing fix

on:
  push:
    branches:
      - feature/sales-trigger-engine
    paths:
      - .github/workflows/one-time-campaign-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time campaign typing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sales-trigger-engine
          fetch-depth: 0

      - name: Patch optional campaign steps typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/ui/DigitaleGewinnerOutboundOS.tsx')
          text = path.read_text()
          old = 'steps?:Step[];error?:string'
          new = 'steps:Step[];error?:string'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit targeted fix
        run: |
          git config user.name "ravoeee-droid"
          git config user.email "ravoeee@gmail.com"
          git add -- app/ui/DigitaleGewinnerOutboundOS.tsx
          git commit -m "Fix AI campaign steps typing"
          git push origin HEAD:feature/sales-trigger-engine
