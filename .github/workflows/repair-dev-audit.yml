name: Repair Dev Audit

on:
  push:
    branches: [feature/revenue-os-2050]
    paths:
      - .github/workflows/repair-dev-audit.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/revenue-os-2050
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable transitive development dependency
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile-only security refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Refresh transitive audit dependency [deps-bot]" || exit 0
          git push origin HEAD:feature/revenue-os-2050
