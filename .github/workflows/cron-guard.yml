name: Cron configuration guard

on:
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - ".github/workflows/cron-guard.yml"
  pull_request:
    paths:
      - "vercel.json"
      - ".github/workflows/cron-guard.yml"
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cron configuration (read-only)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const crons = config.crons ?? [];
          const failures = [];
          const warnings = [];
          const seen = new Set();
          for (const job of crons) {
            if (!job.path || !job.schedule) { failures.push('Cron without path or schedule'); continue; }
            if (seen.has(job.path)) failures.push('Duplicate cron path: ' + job.path);
            seen.add(job.path);
            const pieces = job.schedule.trim().split(/\s+/);
            if (pieces.length !== 5) failures.push('Invalid cron field count: ' + job.path);
            if (!job.path.startsWith('/api/cron/')) warnings.push('Unexpected cron path: ' + job.path);
            const apiFile = 'app' + job.path + '/route.ts';
            if (!fs.existsSync(apiFile) && !fs.existsSync('src/' + apiFile)) {
              failures.push('Cron endpoint source missing: ' + apiFile);
            }
            // GitHub Actions and Vercel both interpret cron schedules in UTC.
            if (/send|loom-campaigns/.test(job.path)) {
              warnings.push('Production outbound schedule (UTC): ' + job.path + ' -> ' + job.schedule);
            }
          }
          if (crons.length === 0) failures.push('No Vercel crons configured');
          console.log('Audited ' + crons.length + ' Vercel cron endpoints. This workflow does not invoke them.');
          for (const warning of warnings) console.log('WARNING: ' + warning);
          for (const failure of failures) console.error('ERROR: ' + failure);
          if (failures.length) process.exit(1);
          NODE
