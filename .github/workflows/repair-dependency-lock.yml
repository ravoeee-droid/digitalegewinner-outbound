name: Repair Dependency Lock

on:
  push:
    branches: [feature/revenue-os-2050]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/repair-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[deps-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/revenue-os-2050
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade production security dependencies
        run: npm install next@16.3.4 nodemailer@9.1.1 sharp@0.35.4 --save-exact --package-lock-only --ignore-scripts
      - name: Align Next.js lint package
        run: npm install eslint-config-next@16.3.4 --save-dev --save-exact --package-lock-only --ignore-scripts
      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade security-sensitive dependencies [deps-bot]" || exit 0
          git push origin HEAD:feature/revenue-os-2050
