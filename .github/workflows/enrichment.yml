# Anreicherungs-Worker als geplanter Job (ohne eigenen Server). Nur DG-MAIN-Secrets hinterlegen.
name: Lead-Anreicherung
on:
  schedule: [{ cron: "7 5-16 * * 1-6" }]   # stündlich Mo–Sa, ca. 7–18 Uhr deutscher Zeit
  workflow_dispatch: {}
concurrency: { group: enrichment, cancel-in-progress: false }
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: worker
      - run: node index.mjs --once
        working-directory: worker
        env:
          WORKER_BUDGET_MIN: "6"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
