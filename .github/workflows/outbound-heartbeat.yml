name: Outbound heartbeat

# Intraday controller for the appointment-driven email engine.
# Requires APP_CRON_SECRET to match CRON_SECRET in Vercel.

on:
  schedule:
    # Every 10 minutes, Mon-Fri, 06:00-19:00 UTC (DE business hours).
    - cron: "*/10 6-19 * * 1-5"
  workflow_dispatch:

jobs:
  outbound-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fill appointment-goal queue
        run: |
          curl -sS -f --connect-timeout 10 --max-time 50 --retry 2 --retry-all-errors             -X POST "https://app.digitalegewinner.de/api/cron/appointment-goal"             -H "authorization: Bearer ${{ secrets.APP_CRON_SECRET }}"             -o /tmp/goal.json -w "\nHTTP %{http_code}\n"
          cat /tmp/goal.json

      - name: Send queued outbound emails
        if: always()
        run: |
          curl -sS -f --connect-timeout 10 --max-time 50 --retry 2 --retry-all-errors             -X POST "https://app.digitalegewinner.de/api/cron/send"             -H "authorization: Bearer ${{ secrets.APP_CRON_SECRET }}"             -o /tmp/send.json -w "\nHTTP %{http_code}\n"
          cat /tmp/send.json

      - name: Check inbox replies
        if: always()
        run: |
          curl -sS -f --connect-timeout 10 --max-time 50 --retry 2 --retry-all-errors             -X POST "https://app.digitalegewinner.de/api/cron/replies"             -H "authorization: Bearer ${{ secrets.APP_CRON_SECRET }}"             -o /tmp/replies.json -w "\nHTTP %{http_code}\n"
          cat /tmp/replies.json
