services:
  app:
    build: ../..
    restart: unless-stopped
    env_file: ./app.env
    expose: ["3000"]
  worker:
    build: ../../worker
    restart: unless-stopped
    env_file: ./app.env
    environment:
      WORKER_CONCURRENCY: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen, z. B. cockpit.deine-domain.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
